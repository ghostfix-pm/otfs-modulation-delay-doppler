[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "otfs-sim"
version = "0.2.0"
description = "OTFS delay-Doppler channel modelling and message-passing detection"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Alirıza Bilir" }]
keywords = ["otfs", "delay-doppler", "message passing", "5g", "6g", "waveform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.22", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
otfs-sim = "otfs.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 115
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# `l` is the delay-tap index of the paper (and of the MATLAB reference), and the
# ported plotting code uses the original `a; b` style on single lines.
ignore = ["E741", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
